<!-- student management system INPUT STUDENT NAME ROLL NO. COURSE MARKS TOTAL STUDENT AVERAGE MARKS-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <student-system>
            student name: <input type="text" id="studentName" placeholder="Enter student name"><br><br>
            roll no: <input type="text" id="rollNo" placeholder="Enter roll number"><br><br>
            course: <input type="text" id="course" placeholder="Enter course"><br><br>
            marks: <input type="number" id="marks" placeholder="Enter marks"><br><br>
            <button id="addStudentBtn">Add Student</button><br><br>
            <div id="studentList"></div>
        </student-system>
        <form action="" method="post">
            <label for="totalMarks">Total Marks:</label>
            <input type="number" id="totalMarks" name="totalMarks" required><br><br>
            <label for="averageMarks">Average Marks:</label>
            <input type="number" id="averageMarks" name="averageMarks" required><br><br>
            <input type="submit" value="Submit">
        </form>

    </header>
